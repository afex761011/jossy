<html>
    <head>
        <meta charset="utf-8">
    <title>New HTML5 Input Types</title>
     </head>
     <body>
        <h1>New HTML5 Input Types Demo</h1>
        <p> This form demonstrates the new HTML5 input types and the place required and auto focus attributes.</p>
        <form method="post"action="http://www.deitel.com">
            <p><label>color:<inputtype="ADD8e6" autofocus/></label></p>
            <p><label>date:<input type="2026-12-31"/>(yyyy-mm-dd)</label></p>
            <p><label>email:<input type="email" placeholder="jdemo2205@gmail.com"(name@domain.com)></label></p>
            <p><label>Number:<input type="number" min="0" max="7" step="1"/>(1-10)</label></p>
            <p><label>Range:<input type="range" min="0" max="20" value="10"/></label></p>
            <p><label>Search:<inputtype="search"placeholder="searchquery></label></p>
            <p><label>URL:inputype="url"placeholder="http://www.example.com"></label></p>
            <p> 
                <inputype="submit" value="Submit "/>
                <input type="reset" value="Clear"/>
            </p>
        </form>
     </body>
